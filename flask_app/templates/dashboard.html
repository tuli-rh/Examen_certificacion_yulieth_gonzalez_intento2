{% extends 'base.html' %}
{% block content %}
<header class="top-header">
    <h2>Bienveni d@, {{ usuario.nombre }}</h2>
    <nav>
        <a href="/nueva">Nueva Entrada</a> | 
        <a href="/logout">Cerrar Sesión</a>
    </nav>
</header>

<div class="search-bar">
    <form action="/buscar" method="get">
        <input type="text" name="termino" placeholder="Término a Buscar" required>
        <button type="submit" class="btn-search">Buscar</button>
    </form>
</div>

<div class="entries-grid">
    {% for entrada in entradas %}
        <div class="entry-card">
            <h3>Entrada</h3>
            <p class="date">{{ entrada.fecha_entrada.strftime('%Y-%m-%d') }}</p>
            <div class="card-actions">
                <a href="/editar/{{ entrada.id }}" class="btn-card">Editar</a>
                <a href="/borrar/{{ entrada.id }}" class="btn-card">Borrar</a>
                <a href="/ver/{{ entrada.id }}" class="btn-card">Ver</a>
            </div>
        </div>
    {% else %}
        <p>No tienes entradas registradas.</p>
    {% endfor %}
</div>
{% endblock %}
